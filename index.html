<!DOCTYPE html>
<html>
<head>
<title>Dabi Ride</title>
</head>
<body>

<h2>Dabi Ride Booking</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<input id="pickup" placeholder="Pickup"><br><br>
<input id="drop" placeholder="Drop"><br><br>

<button onclick="bookRide()">Book Ride</button>

<p id="rideInfo"></p>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyABuwyaR9hYdeHpqm9-NK0hc_LEXUKk5ls",
  authDomain: "dabi-ride.firebaseapp.com",
  databaseURL: "https://dabi-ride-default-rtdb.firebaseio.com/",
  projectId: "dabi-ride"
};

firebase.initializeApp(firebaseConfig);

function bookRide() {
  var name = document.getElementById("name").value;
  var phone = document.getElementById("phone").value;
  var pickup = document.getElementById("pickup").value;
  var drop = document.getElementById("drop").value;

  var rideId = "ride_" + Date.now();

  firebase.database().ref("rides/" + rideId).set({
    name, phone, pickup, drop, status: "pending"
  });

  document.getElementById("rideInfo").innerText =
  "Ride ID: " + rideId;

  // WhatsApp
  var msg = "Ride ID: " + rideId;
  window.open("https://wa.me/91" + phone + "?text=" + msg);

  window.location.href = "track.html?rideId=" + rideId;
}
</script>

</body>
</html>
