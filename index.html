<!DOCTYPE html>
<html>
<head>
<title>Dabi Ride</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; }

.topbar {
  position:absolute; top:0; width:100%;
  background:#ffcc00; padding:12px;
  text-align:center; font-weight:bold;
  z-index:1000;
}

.sheet {
  position:absolute; bottom:0; width:100%;
  background:white; border-radius:20px 20px 0 0;
  padding:15px; box-shadow:0 -4px 10px rgba(0,0,0,0.2);
  z-index:1000;
}

input, button {
  width:100%; padding:12px; margin:5px 0;
  border-radius:8px;
}

button {
  background:black; color:white; border:none;
}

.small { background:#eee; color:black; }

.info { font-weight:bold; }
</style>

</head>
<body>

<div class="topbar">🚀 Dabi Ride</div>
<div id="map"></div>

<div class="sheet">

<h3>Book Ride</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="pickup" placeholder="Pickup (GPS)">
<input id="drop" placeholder="Drop">

<button onclick="getLocation()">Use My Location</button>
<button onclick="bookRide()">Book Ride</button>

<p id="distance" class="info"></p>
<p id="fare" class="info"></p>

<hr>

<h3>Driver</h3>

<input id="rideId" placeholder="Ride ID">
<button onclick="startRide()">Start Ride</button>
<button class="small" onclick="completeRide()">Complete Ride</button>

<p id="status"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyABuwyaR9hYdeHpqm9-NK0hc_LEXUKk5ls",
  authDomain: "dabi-ride.firebaseapp.com",
  databaseURL: "https://dabi-ride-default-rtdb.firebaseio.com/",
  projectId: "dabi-ride"
};
firebase.initializeApp(firebaseConfig);

let rideId="", watchId, route=[];
let map=L.map('map').setView([26,75],15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker=L.marker([26,75]).addTo(map);
let polyline=L.polyline(route,{color:'black'}).addTo(map);

// GPS
function getLocation(){
 navigator.geolocation.getCurrentPosition(pos=>{
  let lat=pos.coords.latitude;
  let lng=pos.coords.longitude;
  pickup.value=lat+","+lng;
  map.setView([lat,lng]);
  marker.setLatLng([lat,lng]);
 });
}

// Distance
function calc(lat1,lon1,lat2,lon2){
 let R=6371;
 let dLat=(lat2-lat1)*Math.PI/180;
 let dLon=(lon2-lon1)*Math.PI/180;
 let a=Math.sin(dLat/2)**2 +
 Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
 Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// BOOK
function bookRide(){
 let p=pickup.value.split(",");
 let lat1=parseFloat(p[0]);
 let lng1=parseFloat(p[1]);

 let lat2=lat1+0.02;
 let lng2=lng1+0.02;

 let dist=calc(lat1,lng1,lat2,lng2);
 let fare=Math.round(dist*10);

 distance.innerText="Distance: "+dist.toFixed(2)+" KM";
 fareBox.innerText="Fare: ₹"+fare;

 rideId="ride_"+Date.now();

 firebase.database().ref("rides/"+rideId).set({
  lat1,lng1,lat2,lng2,dist,fare,status:"pending"
 });

 rideIdInput.value=rideId;
 track();
}

// DRIVER
function startRide(){
 let id=rideIdInput.value;

 watchId=navigator.geolocation.watchPosition(pos=>{
  let lat=pos.coords.latitude;
  let lng=pos.coords.longitude;

  firebase.database().ref("rides/"+id).update({
   lat,lng,status:"on the way"
  });

  status.innerText="Driver moving...";
 });
}

// COMPLETE
function completeRide(){
 let id=rideIdInput.value;

 firebase.database().ref("rides/"+id).update({
  status:"completed"
 });

 if(watchId) navigator.geolocation.clearWatch(watchId);

 route=[]; polyline.setLatLngs([]);
 alert("Ride Completed");
}

// TRACK
function track(){
 firebase.database().ref("rides/"+rideId).on("value",snap=>{
  let d=snap.val();
  if(d && d.lat){
   let loc=[d.lat,d.lng];
   marker.setLatLng(loc);
   map.panTo(loc);
   route.push(loc);
   polyline.setLatLngs(route);
  }
 });
}

// shortcuts
let pickup=document.getElementById("pickup");
let distance=document.getElementById("distance");
let fareBox=document.getElementById("fare");
let rideIdInput=document.getElementById("rideId");
let status=document.getElementById("status");
</script>

</body>
</html>
