<!DOCTYPE html>
<html>
<head>
<title>Driver Panel</title>
</head>
<body>

<h2>Driver Panel</h2>

<input id="rideId" placeholder="Enter Ride ID"><br><br>
<button onclick="start()">Start Ride</button>

<p id="status"></p>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyABuwyaR9hYdeHpqm9-NK0hc_LEXUKk5ls",
  authDomain: "dabi-ride.firebaseapp.com",
  databaseURL: "https://dabi-ride-default-rtdb.firebaseio.com/",
  projectId: "dabi-ride"
};

firebase.initializeApp(firebaseConfig);

function start() {

  var rideId = document.getElementById("rideId").value;

  if(rideId == ""){
    alert("Enter Ride ID");
    return;
  }

  document.getElementById("status").innerText = "Tracking started...";

  navigator.geolocation.watchPosition(
    function(pos) {

      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;

      firebase.database().ref("rides/" + rideId).update({
        status: "on the way",
        lat: lat,
        lng: lng
      });

      document.getElementById("status").innerText =
      "Live: " + lat + ", " + lng;

    },
    function(error){
      alert("Location error: " + error.message);
    },
    {
      enableHighAccuracy: true
    }
  );
}
</script>

</body>
</html>
