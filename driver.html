<!DOCTYPE html>
<html>
<head>
<title>Driver Panel</title>
</head>
<body>

<h2>Driver Panel</h2>

<input id="rideId" placeholder="Enter Ride ID"><br><br>

<button onclick="startRide()">Start Ride</button>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyABuwyaR9hYdeHpqm9-NK0hc_LEXUKk5ls",
  authDomain: "dabi-ride.firebaseapp.com",
  databaseURL: "https://dabi-ride-default-rtdb.firebaseio.com/",
  projectId: "dabi-ride"
};

firebase.initializeApp(firebaseConfig);

function startRide(){

  var rideId = document.getElementById("rideId").value;

  if(rideId==""){
    alert("Enter Ride ID");
    return;
  }

  navigator.geolocation.watchPosition(function(pos){

    firebase.database().ref("rides/" + rideId).update({
      status: "on the way",
      lat: pos.coords.latitude,
      lng: pos.coords.longitude
    });

  });
}
</script>

</body>
</html>
