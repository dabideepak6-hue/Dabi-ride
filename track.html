<!DOCTYPE html>
<html>
<head>
  <title>Track Ride - Dabi Ride</title>

  <!-- Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_MAP_KEY"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>

<body>

<div id="map"></div>

<script>
// Firebase config
var firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT"
};
firebase.initializeApp(firebaseConfig);

// Ride ID URL se
const params = new URLSearchParams(window.location.search);
const rideId = params.get("rideId");

// Map
var map = new google.maps.Map(document.getElementById("map"), {
  zoom: 15,
  center: { lat: 26.0, lng: 75.0 }
});

var marker = new google.maps.Marker({
  map: map,
  title: "Driver Location"
});

// Live tracking
firebase.database().ref("rides/" + rideId).on("value", function(snapshot) {
  var data = snapshot.val();

  if(data && data.lat){
    var loc = { lat: data.lat, lng: data.lng };

    marker.setPosition(loc);
    map.setCenter(loc);
  }
});
</script>

</body>
</html>
