<!DOCTYPE html>
<html>
<head>
<title>Track Ride</title>
</head>
<body>

<h2>Tracking...</h2>

<p id="status"></p>
<p id="location"></p>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyABuwyaR9hYdeHpqm9-NK0hc_LEXUKk5ls",
  authDomain: "dabi-ride.firebaseapp.com",
  databaseURL: "https://dabi-ride-default-rtdb.firebaseio.com/",
  projectId: "dabi-ride"
};

firebase.initializeApp(firebaseConfig);

// URL se rideId lo
var urlParams = new URLSearchParams(window.location.search);
var rideId = urlParams.get("rideId");

firebase.database().ref("rides/" + rideId).on("value", function(snapshot) {

  var data = snapshot.val();

  if(data){
    document.getElementById("status").innerText =
    "Status: " + data.status;

    if(data.lat){
      document.getElementById("location").innerText =
      "Driver Location: " + data.lat + ", " + data.lng;
    }
  }
});
</script>

</body>
</html>
